# LlamaUI Cargo 构建配置
# 优化开发体验，确保可重复构建

[alias]
# 常用命令简写
ch = "check"
cl = "clippy"
t = "test"
b = "build"
r = "run"
br = "build --release"
rr = "run --release"
ct = "test --lib -- --test-threads=1"
cca = "clippy --all-targets -- -D warnings"

[build]
# 增量编译加速
incremental = true
# 目标目录
target-dir = "target"

[term]
# 更友好的错误输出
verbose = false
progress.when = "auto"

[env]
# 关闭 Windows 控制台快速编辑模式（避免进程挂起）
# 仅开发调试时有用
RUST_BACKTRACE = "1"

[target.x86_64-pc-windows-msvc]
# Windows MSVC 目标配置
rustflags = [
    # 强制启用控制台（dev 模式调试用）
    # "-C", "link-args=/SUBSYSTEM:CONSOLE",
]

[profile.dev]
# 开发模式：更快编译速度
opt-level = 0
debug = true
strip = false
debug-assertions = true
overflow-checks = true
lto = false
codegen-units = 16

[profile.dev.package."*"]
# 第三方依赖最小优化，加速编译
opt-level = 0