name: Release

# ─── 触发条件 ───────────────────────────────────────────────────────────────
# 仅对 v* 格式的 tag push 触发；也支持手动触发（指定 tag）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.6.0)'
        required: true
        type: string

# ─── 权限 ────────────────────────────────────────────────────────────────────
permissions:
  contents: write   # 允许 gh release 创建/更新 release

# ─── 并发控制 ─────────────────────────────────────────────────────────────────
# 同一 tag 不会并发运行；旧任务自动取消。
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: true

# ─── 预检查（不阻塞构建） ────────────────────────────────────────────────────
jobs:
  precheck:
    name: Pre-release audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Resolve version
        id: ver
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install cargo-audit (optional, do not fail the job)
        run: cargo install --locked cargo-audit 2>/dev/null || echo "cargo-audit not installed, skipping audit"

      - name: Security audit (soft-fail)
        # cargo audit 默认仅在出现 vulnerability（严重等级）时返回非 0。
        # unmaintained / yanked / informational 警告不会阻塞发版。
        # 若 cargo-audit 未安装则跳过，不中断流程。
        run: |
          if command -v cargo-audit &>/dev/null; then
            echo "⚠️  Running cargo audit …"
            cargo audit || true   # 允许 audit 失败，但记录日志
          else
            echo "ℹ️  cargo-audit 未安装，跳过安全审计"
          fi

      - name: Check Cargo.lock is committed
        run: |
          if git diff --exit-code -- Cargo.lock; then
            echo "✅ Cargo.lock 已提交"
          else
            echo "⚠️  Cargo.lock 有未提交的变更，可能影响构建可重复性"
            echo "   建议先执行：cargo update && git add Cargo.lock && git commit"
          fi

  # ─── 多平台构建 ────────────────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.os_name }} ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Windows ──
          - platform: windows-latest
            rust_target: x86_64-pc-windows-msvc
            os_name: Windows
            arch: x64
          - platform: windows-latest
            rust_target: i686-pc-windows-msvc
            os_name: Windows
            arch: x86
          - platform: windows-latest
            rust_target: aarch64-pc-windows-msvc
            os_name: Windows
            arch: arm64
          # ── Linux ──
          - platform: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            os_name: Linux
            arch: x64
          - platform: ubuntu-22.04-arm
            rust_target: aarch64-unknown-linux-gnu
            os_name: Linux
            arch: arm64
          # ── macOS ──
          - platform: macos-latest
            rust_target: x86_64-apple-darwin
            os_name: macOS
            arch: x64
          - platform: macos-latest
            rust_target: aarch64-apple-darwin
            os_name: macOS
            arch: arm64

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60   # 单次构建最长 60 分钟，超时自动取消

    steps:
      # ── 1. 检出代码 ─────────────────────────────────────────────────────────
      - uses: actions/checkout@v5

      # ── 2. 安装 Rust 工具链 ─────────────────────────────────────────────────
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      # ── 3. 缓存依赖（加速重复构建） ─────────────────────────────────────────
      - name: Cache cargo registry & target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ matrix.rust_target }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ matrix.rust_target }}-cargo-

      # ── 4. 安装系统依赖（仅 Linux） ────────────────────────────────────────
      - name: Install dependencies (ubuntu)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            xdg-utils

      # ── 5. 安装 Tauri CLI ───────────────────────────────────────────────────
      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2"

      # ── 6. 解析版本号 ───────────────────────────────────────────────────────
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building: $TAG (${{ matrix.os_name }} ${{ matrix.arch }})"

      # ── 7. 构建 ─────────────────────────────────────────────────────────────
      - name: Build
        run: cargo tauri build --target ${{ matrix.rust_target }}

      # ── 8. 收集产物（Windows） ──────────────────────────────────────────────
      - name: Collect artifacts (Windows)
        if: matrix.os_name == 'Windows'
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NAME="LlamaUI_${VERSION}_${{ matrix.os_name }}_${{ matrix.arch }}"
          RELEASE_DIR="target/${{ matrix.rust_target }}/release"
          mkdir -p artifacts

          # NSIS 安装包
          for f in "$RELEASE_DIR"/bundle/nsis/*.exe; do
            cp "$f" "artifacts/${NAME}.exe" && break
          done
          # MSI 安装包
          for f in "$RELEASE_DIR"/bundle/msi/*.msi; do
            cp "$f" "artifacts/${NAME}.msi" && break
          done
          # 便携版 ZIP（exe + dist/）
          mkdir -p portable
          cp "$RELEASE_DIR"/llama-ui.exe portable/ 2>/dev/null \
            || cp "$RELEASE_DIR"/llama_ui.exe portable/ 2>/dev/null || true
          cp -r dist/ portable/dist/ || true
          7z a "artifacts/${NAME}.zip" portable/ || true
          rm -rf portable

          ls -lh artifacts/

      # ── 9. 收集产物（Linux） ────────────────────────────────────────────────
      - name: Collect artifacts (Linux)
        if: matrix.os_name == 'Linux'
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NAME="LlamaUI_${VERSION}_${{ matrix.os_name }}_${{ matrix.arch }}"
          RELEASE_DIR="target/${{ matrix.rust_target }}/release"
          mkdir -p artifacts

          # .deb 包
          for f in "$RELEASE_DIR"/bundle/deb/*.deb; do
            cp "$f" "artifacts/${NAME}.deb" && break
          done
          # AppImage
          for f in "$RELEASE_DIR"/bundle/appimage/*.AppImage; do
            cp "$f" "artifacts/${NAME}.AppImage" && break
          done
          # 便携版 tar.gz
          mkdir -p portable
          cp "$RELEASE_DIR"/llama-ui portable/ 2>/dev/null \
            || cp "$RELEASE_DIR"/llama_ui portable/ 2>/dev/null || true
          cp -r dist/ portable/dist/ || true
          tar czf "artifacts/${NAME}.tar.gz" -C portable . || true
          rm -rf portable

          ls -lh artifacts/

      # ── 10. 收集产物（macOS） ───────────────────────────────────────────────
      - name: Collect artifacts (macOS)
        if: matrix.os_name == 'macOS'
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NAME="LlamaUI_${VERSION}_${{ matrix.os_name }}_${{ matrix.arch }}"
          RELEASE_DIR="target/${{ matrix.rust_target }}/release"
          mkdir -p artifacts

          # DMG 安装包
          for f in "$RELEASE_DIR"/bundle/dmg/*.dmg; do
            cp "$f" "artifacts/${NAME}.dmg" && break
          done
          # 便携版 tar.gz（.app bundle + dist/）
          mkdir -p portable
          cp -r "$RELEASE_DIR"/bundle/macos/LlamaUI.app portable/ 2>/dev/null || true
          cp -r dist/ portable/dist/ || true
          tar czf "artifacts/${NAME}.tar.gz" -C portable . || true
          rm -rf portable

          ls -lh artifacts/

      # ── 11. 上传产物 ────────────────────────────────────────────────────────
      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.os_name }}-${{ matrix.arch }}
          path: artifacts/
          if-no-files-found: error   # 产物为空则立即报错
          retention-days: 1          # 构建完成后 1 天自动清理

  # ─── 发布 Release ─────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: build
    if: always() && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ── 1. 解析版本号 ───────────────────────────────────────────────────────
      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # ── 2. 下载全部产物 ─────────────────────────────────────────────────────
      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts

      # ── 3. 检查是否有成功构建的产物 ─────────────────────────────────────────
      - name: Verify artifacts
        run: |
          count=$(find artifacts -type f | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "❌ 没有可用的构建产物，跳过 Release 发布"
            exit 1
          fi
          echo "✅ 找到 $count 个产物文件"
          find artifacts -type f -exec ls -lh {} \;

      # ── 4. 整理产物到 release_files/ ────────────────────────────────────────
      - name: Flatten artifacts
        run: |
          mkdir -p release_files
          # 拷贝所有文件，排除 .txt 文件（checksum 单独生成）
          find artifacts -type f ! -name '*.txt' -exec cp {} release_files/ \;
          echo "=== release_files ==="
          ls -lh release_files/

      # ── 5. 生成 SHA256 校验和 ───────────────────────────────────────────────
      - name: Generate checksums
        run: |
          cd release_files
          sha256sum * | sort -k2 > ../SHA256SUMS.txt
          cd ..
          echo "=== SHA256SUMS ==="
          cat SHA256SUMS.txt

      # ── 6. 生成 Release Notes ──────────────────────────────────────────────
      - name: Generate release notes
        id: notes
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          DATE=$(date -u +%Y-%m-%d)
          REPO="${{ github.repository }}"
          BASE_URL="https://github.com/${REPO}/releases/download/${TAG}"

          # 从实际产物文件名推断下载表：LlamaUI_<ver>_<os>_<arch>.<ext>
          # 平台中文名 + 格式说明
          declare -A PLATFORM_CN=(
            ["Windows"]="Windows"
            ["Linux"]="Linux"
            ["macOS"]="macOS"
          )
          declare -A ARCH_CN=(
            ["x64"]="x64"
            ["x86"]="x86"
            ["arm64"]="arm64"
          )
          declare -A EXTN_CN=(
            ["exe"]="NSIS 安装程序"
            ["msi"]="MSI 安装程序"
            ["zip"]="便携版"
            ["deb"]="Debian/Ubuntu"
            ["AppImage"]="通用应用"
            ["tar.gz"]="便携版"
            ["dmg"]="磁盘映像"
          )

          echo "## LlamaUI ${TAG}" > /tmp/release-notes.md
          echo "" >> /tmp/release-notes.md
          echo "**发布日期**：${DATE}" >> /tmp/release-notes.md
          echo "" >> /tmp/release-notes.md
          echo "---" >> /tmp/release-notes.md
          echo "" >> /tmp/release-notes.md
          echo "### 新增功能" >> /tmp/release-notes.md
          echo "" >> /tmp/release-notes.md
          echo "_本次发布以代码质量与依赖安全为主，无新增对外功能。_" >> /tmp/release-notes.md
          echo "" >> /tmp/release-notes.md
          echo "### 改进" >> /tmp/release-notes.md
          echo "" >> /tmp/release-notes.md
          echo "- 清理仓库开发垃圾与调试产物，统一 .gitignore 规范" >> /tmp/release-notes.md
          echo "- 移除未使用的 \`metrics_enhanced\` 模块及 \`model_management\` 死代码" >> /tmp/release-notes.md
          echo "- 优化 \`remote_server.validate_url\` 判定逻辑，避免 HTTP 公网地址被误判为本地地址" >> /tmp/release-notes.md
          echo "" >> /tmp/release-notes.md
          echo "### 修复" >> /tmp/release-notes.md
          echo "" >> /tmp/release-notes.md
          echo "- 修复 \`commands/mod.rs\` 测试模块缺失 \`CancelFlag\` 导入导致的 E0425 编译错误" >> /tmp/release-notes.md
          echo "- 解决 \`gpu_cmd\` / \`llama_downloader\` / \`update_check\` 等模块的 clippy 警告" >> /tmp/release-notes.md
          echo "" >> /tmp/release-notes.md
          echo "### 依赖与安全" >> /tmp/release-notes.md
          echo "" >> /tmp/release-notes.md
          echo "- 升级 \`time\` 至 0.3.53（修复 RUSTSEC-2026-0009 栈溢出 DoS）" >> /tmp/release-notes.md
          echo "- 升级 \`ring\` 至 0.17.14（修复 RUSTSEC-2025-0009 AES panic）" >> /tmp/release-notes.md
          echo "- 升级 \`rustls\` 至 0.23.43（修复 RUSTSEC-2024-0336 \`complete_io\` 死循环）" >> /tmp/release-notes.md
          echo "- \`event-listener\` 锁定 5.4.2（修复 RUSTSEC-2026-0221 Send/Sync unsoundness）" >> /tmp/release-notes.md
          echo "- 已知告警：\`glib <0.20.0\` 受 RUSTSEC-2024-0429 影响（\`webkit2gtk-sys\` 上游传递依赖），仅影响 Linux 平台，详见 [SECURITY.md](https://github.com/${REPO}/blob/${TAG}/SECURITY.md)" >> /tmp/release-notes.md
          echo "" >> /tmp/release-notes.md
          echo "### 下载" >> /tmp/release-notes.md
          echo "" >> /tmp/release-notes.md
          echo "| 平台 | 架构 | 文件 | 说明 |" >> /tmp/release-notes.md
          echo "|------|------|------|------|" >> /tmp/release-notes.md
          # 按"平台/架构/格式"分组产出实际文件名
          for f in $(ls release_files/ | sort); do
            # 解析 LlamaUI_<ver>_<os>_<arch>.<ext>；AppImage / tar.gz 需特殊处理
            base="${f%.*}"
            if [[ "$f" == *.tar.gz ]]; then ext="tar.gz"; base="${f%.tar.gz}"
            elif [[ "$f" == *.AppImage ]]; then ext="AppImage"; base="${f%.AppImage}"
            elif [[ "$f" == *.exe ]]; then ext="exe"; base="${f%.exe}"
            elif [[ "$f" == *.msi ]]; then ext="msi"; base="${f%.msi}"
            elif [[ "$f" == *.zip ]]; then ext="zip"; base="${f%.zip}"
            elif [[ "$f" == *.deb ]]; then ext="deb"; base="${f%.deb}"
            elif [[ "$f" == *.dmg ]]; then ext="dmg"; base="${f%.dmg}"
            else continue; fi
            # base = LlamaUI_<ver>_<os>_<arch>
            rest="${base#LlamaUI_${VERSION}_}"
            arch="${rest##*_}"
            os="${rest%_*}"
            platform_cn="${PLATFORM_CN[$os]:-$os}"
            arch_cn="${ARCH_CN[$arch]:-$arch}"
            ext_cn="${EXTN_CN[$ext]:-$ext}"
            echo "| ${platform_cn} | ${arch_cn} | [${f}](${BASE_URL}/${f}) | ${ext_cn} |" >> /tmp/release-notes.md
          done
          echo "" >> /tmp/release-notes.md
          echo "### 哈希校验" >> /tmp/release-notes.md
          echo "" >> /tmp/release-notes.md
          echo "<details>" >> /tmp/release-notes.md
          echo "<summary>展开查看 SHA256 校验和</summary>" >> /tmp/release-notes.md
          echo "" >> /tmp/release-notes.md
          echo '```' >> /tmp/release-notes.md
          cat SHA256SUMS.txt >> /tmp/release-notes.md
          echo '```' >> /tmp/release-notes.md
          echo "" >> /tmp/release-notes.md
          echo "</details>" >> /tmp/release-notes.md
          echo "" >> /tmp/release-notes.md
          echo "完整变更日志：[CHANGELOG.md](https://github.com/${REPO}/blob/${TAG}/CHANGELOG.md)" >> /tmp/release-notes.md

          {
            echo "body<<EOF"
            cat /tmp/release-notes.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # ── 7. 删除已有 Release（幂等） ─────────────────────────────────────────
      - name: Delete existing release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null \
            || echo "No existing release to delete"

      # ── 8. 创建 GitHub Release ─────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: LlamaUI ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: false
          body: ${{ steps.notes.outputs.body }}
          files: |
            release_files/*
            SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
