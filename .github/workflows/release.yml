name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - platform: windows-latest
            rust_target: x86_64-pc-windows-msvc
            artifact_suffix: windows-x64
          # Linux
          - platform: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            artifact_suffix: linux-x64
          # macOS
          - platform: macos-latest
            rust_target: aarch64-apple-darwin
            artifact_suffix: macos-arm64

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install dependencies (ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2"

      - name: Build
        run: cargo tauri build --target ${{ matrix.rust_target }}

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          VERSION="${GITHUB_REF_NAME#v}"
          RELEASE_DIR="target/${{ matrix.rust_target }}/release"

          # 列出 release 目录内容，便于调试
          echo "=== Release directory contents ==="
          ls -la "$RELEASE_DIR/" | head -20

          # Windows: NSIS installer + MSI
          if [ "${{ matrix.platform }}" = "windows-latest" ]; then
            cp "$RELEASE_DIR"/bundle/nsis/*.exe artifacts/ || true
            cp "$RELEASE_DIR"/bundle/msi/*.msi artifacts/ || true
            # 便携版（zip）：打包 exe + dll + dist 目录
            mkdir -p portable
            cp "$RELEASE_DIR"/llama-ui.exe portable/ 2>/dev/null || cp "$RELEASE_DIR"/llama_ui.exe portable/ 2>/dev/null || true
            cp "$RELEASE_DIR"/llama_ui_lib.dll portable/ || true
            cp -r dist/ portable/dist/ || true
            7z a "artifacts/llama-ui-${VERSION}-${{ matrix.artifact_suffix }}.zip" portable/ || true
            rm -rf portable
          fi

          # Linux: AppImage + deb
          if [ "${{ matrix.platform }}" = "ubuntu-22.04" ]; then
            cp "$RELEASE_DIR"/bundle/appimage/*.AppImage artifacts/ || true
            cp "$RELEASE_DIR"/bundle/deb/*.deb artifacts/ || true
            # 便携版（tar.gz）：打包可执行文件 + dist 目录
            mkdir -p portable
            cp "$RELEASE_DIR"/llama-ui portable/ 2>/dev/null || cp "$RELEASE_DIR"/llama_ui portable/ 2>/dev/null || true
            cp -r dist/ portable/dist/ || true
            tar czf "artifacts/llama-ui-${VERSION}-${{ matrix.artifact_suffix }}.tar.gz" -C portable . || true
            rm -rf portable
          fi

          # macOS: DMG + app
          if [ "${{ matrix.platform }}" = "macos-latest" ]; then
            cp "$RELEASE_DIR"/bundle/dmg/*.dmg artifacts/ || true
            # 便携版（tar.gz）：打包 .app + dist 目录
            mkdir -p portable
            cp -r "$RELEASE_DIR"/bundle/macos/LlamaUI.app portable/ 2>/dev/null || true
            cp -r dist/ portable/dist/ || true
            tar czf "artifacts/llama-ui-${VERSION}-${{ matrix.artifact_suffix }}.tar.gz" -C portable . || true
            rm -rf portable
          fi

          echo "=== Artifacts ==="
          ls -la artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_suffix }}
          path: artifacts/*
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List all downloaded files
        run: find artifacts -type f | sort

      - name: Generate SHA256 checksums
        run: |
          cd artifacts
          find . -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.dmg" -o -name "*.zip" -o -name "*.tar.gz" \) \
            -exec sha256sum {} \; | sed 's| \./| |' | sed 's|^./||' | sort -k2 > ../SHA256SUMS.txt
          cd ..
          echo "=== SHA256SUMS ==="
          cat SHA256SUMS.txt

      - name: Generate release notes
        id: notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          {
            echo "body<<EOF"
            echo "## LlamaUI ${TAG}"
            echo ""
            echo "### 下载说明"
            echo ""
            echo "| 平台 | 文件 | 说明 |"
            echo "|------|------|------|"
            echo "| Windows x64 | \`.exe\` | NSIS 安装程序 |"
            echo "| Windows x64 | \`.msi\` | MSI 安装程序 |"
            echo "| Windows x64 | \`.zip\` | 便携版（免安装） |"
            echo "| Linux x64 | \`.deb\` | Debian/Ubuntu 包 |"
            echo "| Linux x64 | \`.AppImage\` | 通用 Linux 应用 |"
            echo "| Linux x64 | \`.tar.gz\` | 便携版（免安装） |"
            echo "| macOS arm64 | \`.dmg\` | macOS 磁盘映像 |"
            echo "| macOS arm64 | \`.tar.gz\` | 便携版（免安装） |"
            echo ""
            echo "### SHA256 校验"
            echo ""
            echo "\`\`\`"
            cat SHA256SUMS.txt
            echo "\`\`\`"
            echo ""
            echo "### 变更日志"
            echo ""
            echo "详见 [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)"
            echo ""
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: LlamaUI ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: ${{ steps.notes.outputs.body }}
          files: |
            artifacts/**/*
            SHA256SUMS.txt
