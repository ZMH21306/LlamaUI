name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.4.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64
          - platform: windows-latest
            rust_target: x86_64-pc-windows-msvc
            os_name: Windows
            arch: x64
          # Windows x86
          - platform: windows-latest
            rust_target: i686-pc-windows-msvc
            os_name: Windows
            arch: x86
          # Windows arm64
          - platform: windows-latest
            rust_target: aarch64-pc-windows-msvc
            os_name: Windows
            arch: arm64
          # Linux x64
          - platform: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            os_name: Linux
            arch: x64
          # Linux arm64 - use native ARM runner
          - platform: ubuntu-22.04-arm
            rust_target: aarch64-unknown-linux-gnu
            os_name: Linux
            arch: arm64
          # macOS x64 - cross-compile on ARM runner
          - platform: macos-latest
            rust_target: x86_64-apple-darwin
            os_name: macOS
            arch: x64
          # macOS arm64
          - platform: macos-latest
            rust_target: aarch64-apple-darwin
            os_name: macOS
            arch: arm64

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install dependencies (ubuntu)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev xdg-utils

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2"

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved: TAG=${TAG} VERSION=${VERSION}"

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Security audit
        run: cargo audit --deny warnings

      - name: Build
        run: cargo tauri build --target ${{ matrix.rust_target }}

      - name: Collect artifacts (Windows)
        if: matrix.os_name == 'Windows'
        shell: bash
        run: |
          mkdir -p artifacts
          VERSION="${{ steps.version.outputs.version }}"
          NAME="LlamaUI_${VERSION}_${{ matrix.os_name }}_${{ matrix.arch }}"
          RELEASE_DIR="target/${{ matrix.rust_target }}/release"

          # NSIS installer
          for f in "$RELEASE_DIR"/bundle/nsis/*.exe; do
            cp "$f" "artifacts/${NAME}.exe" && break
          done
          # MSI installer
          for f in "$RELEASE_DIR"/bundle/msi/*.msi; do
            cp "$f" "artifacts/${NAME}.msi" && break
          done
          # Portable zip (include exe + dist/)
          mkdir -p portable
          cp "$RELEASE_DIR"/llama-ui.exe portable/ 2>/dev/null || cp "$RELEASE_DIR"/llama_ui.exe portable/ 2>/dev/null || true
          cp -r dist/ portable/dist/ || true
          7z a "artifacts/${NAME}.zip" portable/ || true
          rm -rf portable

          echo "=== Collected artifacts ==="
          ls -la artifacts/

      - name: Collect artifacts (Linux)
        if: matrix.os_name == 'Linux'
        shell: bash
        run: |
          mkdir -p artifacts
          VERSION="${{ steps.version.outputs.version }}"
          NAME="LlamaUI_${VERSION}_${{ matrix.os_name }}_${{ matrix.arch }}"
          RELEASE_DIR="target/${{ matrix.rust_target }}/release"

          # deb package
          for f in "$RELEASE_DIR"/bundle/deb/*.deb; do
            cp "$f" "artifacts/${NAME}.deb" && break
          done
          # AppImage
          for f in "$RELEASE_DIR"/bundle/appimage/*.AppImage; do
            cp "$f" "artifacts/${NAME}.AppImage" && break
          done
          # Portable tar.gz
          mkdir -p portable
          cp "$RELEASE_DIR"/llama-ui portable/ 2>/dev/null || cp "$RELEASE_DIR"/llama_ui portable/ 2>/dev/null || true
          cp -r dist/ portable/dist/ || true
          tar czf "artifacts/${NAME}.tar.gz" -C portable . || true
          rm -rf portable

          echo "=== Collected artifacts ==="
          ls -la artifacts/

      - name: Collect artifacts (macOS)
        if: matrix.os_name == 'macOS'
        shell: bash
        run: |
          mkdir -p artifacts
          VERSION="${{ steps.version.outputs.version }}"
          NAME="LlamaUI_${VERSION}_${{ matrix.os_name }}_${{ matrix.arch }}"
          RELEASE_DIR="target/${{ matrix.rust_target }}/release"

          # DMG installer
          for f in "$RELEASE_DIR"/bundle/dmg/*.dmg; do
            cp "$f" "artifacts/${NAME}.dmg" && break
          done
          # Portable tar.gz
          mkdir -p portable
          cp -r "$RELEASE_DIR"/bundle/macos/LlamaUI.app portable/ 2>/dev/null || true
          cp -r dist/ portable/dist/ || true
          tar czf "artifacts/${NAME}.tar.gz" -C portable . || true
          rm -rf portable

          echo "=== Collected artifacts ==="
          ls -la artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os_name }}-${{ matrix.arch }}
          path: artifacts/*
          if-no-files-found: warn

  release:
    needs: build
    if: always() && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release_files
          find artifacts -type f ! -name "*.txt" -exec cp {} release_files/ \;
          echo "=== Release files ==="
          ls -la release_files/

      - name: Generate SHA256 checksums
        run: |
          cd release_files
          sha256sum * | sort -k2 > ../SHA256SUMS.txt
          cd ..
          echo "=== SHA256SUMS ==="
          cat SHA256SUMS.txt

      - name: Generate release notes
        id: notes
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          DATE=$(date -u +%Y-%m-%d)
          REPO="${{ github.repository }}"
          BASE_URL="https://github.com/${REPO}/releases/download/${TAG}"
          {
            echo "body<<EOF"
            echo "## LlamaUI ${TAG}"
            echo ""
            echo "**发布日期**：${DATE}"
            echo ""
            echo "---"
            echo ""
            echo "### 新增功能"
            echo ""
            echo "- **GPU 自动检测**：支持 NVIDIA/AMD/Intel GPU 型号、驱动版本、CUDA/ROCm 版本检测"
            echo "- **llama-server 自动下载**：一键从 GitHub Releases 下载适配当前 GPU 后端的 llama.cpp 预编译包"
            echo "- **GPU 后端自动选择**：根据 GPU 类型自动选择 CUDA/ROCm/Vulkan/Metal/CPU 后端"
            echo "- **全局日志系统**：基于 tracing 生态，控制台彩色分级输出 + 文件持久化（按日滚动）"
            echo "- **Panic Hook**：崩溃时自动写入完整 backtrace 到日志文件"
            echo "- **前端 GPU 信息卡片**：实时显示 GPU 型号、显存、驱动版本、推荐后端"
            echo "- **前端下载按钮**：支持 llama-server 一键下载、进度条、SHA256 校验"
            echo "- **前端检查更新按钮**：顶栏手动检查更新入口"
            echo ""
            echo "### 改进"
            echo ""
            echo "- 更新检查扩展支持 Linux/macOS 旧版本路径检测"
            echo "- NVIDIA GPU 检测不依赖 CUDA 版本解析"
            echo "- GitHub API 请求添加 Accept header 解决 403 问题"
            echo "- 前端下载进度平滑动画（每帧最多 +2% 渐进）"
            echo ""
            echo "### 修复"
            echo ""
            echo "- tracing_setup.rs 编译错误修复"
            echo "- 移除未使用的 tracing-error 依赖"
            echo ""
            echo "### 下载说明"
            echo ""
            echo "| 平台 | 架构 | 文件 | 说明 |"
            echo "|------|------|------|------|"
            echo "| Windows | x64 | [\`LlamaUI_${VERSION}_Windows_x64.exe\`](${BASE_URL}/LlamaUI_${VERSION}_Windows_x64.exe) | NSIS 安装程序 |"
            echo "| Windows | x64 | [\`LlamaUI_${VERSION}_Windows_x64.msi\`](${BASE_URL}/LlamaUI_${VERSION}_Windows_x64.msi) | MSI 安装程序 |"
            echo "| Windows | x64 | [\`LlamaUI_${VERSION}_Windows_x64.zip\`](${BASE_URL}/LlamaUI_${VERSION}_Windows_x64.zip) | 便携版 |"
            echo "| Windows | x86 | [\`LlamaUI_${VERSION}_Windows_x86.exe\`](${BASE_URL}/LlamaUI_${VERSION}_Windows_x86.exe) | NSIS 安装程序 |"
            echo "| Windows | x86 | [\`LlamaUI_${VERSION}_Windows_x86.msi\`](${BASE_URL}/LlamaUI_${VERSION}_Windows_x86.msi) | MSI 安装程序 |"
            echo "| Windows | x86 | [\`LlamaUI_${VERSION}_Windows_x86.zip\`](${BASE_URL}/LlamaUI_${VERSION}_Windows_x86.zip) | 便携版 |"
            echo "| Windows | arm64 | [\`LlamaUI_${VERSION}_Windows_arm64.exe\`](${BASE_URL}/LlamaUI_${VERSION}_Windows_arm64.exe) | NSIS 安装程序 |"
            echo "| Windows | arm64 | [\`LlamaUI_${VERSION}_Windows_arm64.msi\`](${BASE_URL}/LlamaUI_${VERSION}_Windows_arm64.msi) | MSI 安装程序 |"
            echo "| Windows | arm64 | [\`LlamaUI_${VERSION}_Windows_arm64.zip\`](${BASE_URL}/LlamaUI_${VERSION}_Windows_arm64.zip) | 便携版 |"
            echo "| Linux | x64 | [\`LlamaUI_${VERSION}_Linux_x64.deb\`](${BASE_URL}/LlamaUI_${VERSION}_Linux_x64.deb) | Debian/Ubuntu |"
            echo "| Linux | x64 | [\`LlamaUI_${VERSION}_Linux_x64.AppImage\`](${BASE_URL}/LlamaUI_${VERSION}_Linux_x64.AppImage) | 通用应用 |"
            echo "| Linux | x64 | [\`LlamaUI_${VERSION}_Linux_x64.tar.gz\`](${BASE_URL}/LlamaUI_${VERSION}_Linux_x64.tar.gz) | 便携版 |"
            echo "| Linux | arm64 | [\`LlamaUI_${VERSION}_Linux_arm64.deb\`](${BASE_URL}/LlamaUI_${VERSION}_Linux_arm64.deb) | Debian/Ubuntu |"
            echo "| Linux | arm64 | [\`LlamaUI_${VERSION}_Linux_arm64.AppImage\`](${BASE_URL}/LlamaUI_${VERSION}_Linux_arm64.AppImage) | 通用应用 |"
            echo "| Linux | arm64 | [\`LlamaUI_${VERSION}_Linux_arm64.tar.gz\`](${BASE_URL}/LlamaUI_${VERSION}_Linux_arm64.tar.gz) | 便携版 |"
            echo "| macOS | x64 | [\`LlamaUI_${VERSION}_macOS_x64.dmg\`](${BASE_URL}/LlamaUI_${VERSION}_macOS_x64.dmg) | 磁盘映像 |"
            echo "| macOS | x64 | [\`LlamaUI_${VERSION}_macOS_x64.tar.gz\`](${BASE_URL}/LlamaUI_${VERSION}_macOS_x64.tar.gz) | 便携版 |"
            echo "| macOS | arm64 | [\`LlamaUI_${VERSION}_macOS_arm64.dmg\`](${BASE_URL}/LlamaUI_${VERSION}_macOS_arm64.dmg) | 磁盘映像 |"
            echo "| macOS | arm64 | [\`LlamaUI_${VERSION}_macOS_arm64.tar.gz\`](${BASE_URL}/LlamaUI_${VERSION}_macOS_arm64.tar.gz) | 便携版 |"
            echo ""
            echo "### 哈希校验"
            echo ""
            echo "<details>"
            echo "<summary>展开查看 SHA256 校验和</summary>"
            echo ""
            echo "\`\`\`"
            cat SHA256SUMS.txt
            echo "\`\`\`"
            echo ""
            echo "**校验方法：**"
            echo "- Windows：\`Get-FileHash <文件名> -Algorithm SHA256\`"
            echo "- Linux/macOS：\`sha256sum <文件名>\`"
            echo ""
            echo "</details>"
            echo ""
            echo "---"
            echo ""
            echo "**完整变更日志**：[CHANGELOG.md](https://github.com/${REPO}/blob/main/CHANGELOG.md)"
            echo ""
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Delete existing release (if any)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: LlamaUI ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: false
          body: ${{ steps.notes.outputs.body }}
          files: |
            release_files/*
            SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
